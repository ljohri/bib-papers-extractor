[project]
name = "bibliography-pdf-mcp"
version = "0.1.0"
description = "Local MCP server for extracting bibliography references and downloading public OA PDFs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Lokesh Johri" }
]
license = { text = "MIT" }
keywords = ["mcp", "bibliography", "pdf", "openalex", "crossref", "unpaywall", "arxiv"]

dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "tenacity>=8.0.0",
  "aiofiles>=23.0.0",
  "aiolimiter>=1.1.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "pypdf>=4.0.0",
  "bibtexparser>=1.4.0",
  "pybtex>=0.24.0",
  "rapidfuzz>=3.0.0",
  "titlecase>=2.4.0",
  "python-dateutil>=2.9.0",
  "regex>=2024.0.0",
  "sqlalchemy>=2.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
bibpdf = "bibpdf_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibpdf_mcp"]

[tool.uv]
package = true
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# B008: function calls in arg defaults — Typer's idiomatic pattern requires this.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
